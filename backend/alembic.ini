# Used for `alembic revision --autogenerate` during development.
# The app itself runs migrations programmatically (app.db.session.upgrade_db).
[alembic]
script_location = app/db/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
