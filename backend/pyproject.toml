[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialarb"
version = "0.1.0"
description = "SocialArb (socialarb.trade): review tool for product buzz, price response and retail chatter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "typer>=0.12",
  "exchange_calendars>=4.5",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://socialarb.trade"

[project.scripts]
socialarb = "app.cli:main"
ctm = "app.cli:main"  # legacy alias

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
